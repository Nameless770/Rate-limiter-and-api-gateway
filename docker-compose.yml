# Two gateway instances behind different ports, sharing one Redis. Send requests with the same X-API-Key to
# :8080 and :8081 and they draw from a single rate-limit budget: that is the distributed part.
# Host ports can be moved if they're taken: GATEWAY_A_PORT=18080 GATEWAY_B_PORT=18081 docker compose up
#
# The admin listener (health, metrics) binds to loopback *inside* each container and is not published. To read it:
#   docker compose exec gateway-a wget -qO- http://127.0.0.1:9090/_gateway/metrics
name: api-gateway

services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Rate-limit state is disposable, so skip persistence entirely.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  upstream:
    build:
      context: .
      target: demo-upstream
    environment:
      PORT: "9001"
    ports:
      # Exposed so you can flip /_demo/failure?rate=1 from the host. It's a demo service: don't publish it elsewhere.
      - "127.0.0.1:${UPSTREAM_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9001/health"]
      interval: 10s
      timeout: 3s

  gateway-a: &gateway
    build:
      context: .
      target: runtime
    ports:
      - "${GATEWAY_A_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379
      UPSTREAM_URL: http://upstream:9001
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started

  gateway-b:
    <<: *gateway
    ports:
      - "${GATEWAY_B_PORT:-8081}:8080"

  # The two other ways to deploy Redis, for the tests that cover them (test profile only).
  #
  # A primary, its replica and one sentinel watching them as "gw". The tests force failovers, so which of the two
  # is primary at any moment is whatever the sentinel says.
  redis-primary: &redis-node
    profiles: ["test"]
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replica-announce-ip", "redis-primary"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  redis-replica:
    <<: *redis-node
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--replicaof", "redis-primary", "6379",
       "--replica-announce-ip", "redis-replica"]
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-sentinel:
    <<: *redis-node
    command:
      - sh
      - -c
      - |
        printf '%s\n' 'port 26379' 'sentinel resolve-hostnames yes' 'sentinel announce-hostnames yes' \
          'sentinel monitor gw redis-primary 6379 1' 'sentinel down-after-milliseconds gw 2000' \
          'sentinel failover-timeout gw 10000' > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    depends_on:
      redis-replica:
        condition: service_healthy

  # Three cluster nodes in one container (ports 7000-7002), announcing this service's name so clients in the
  # Compose network can reach every node the slot map points them at.
  redis-cluster:
    <<: *redis-node
    command:
      - sh
      - -c
      - |
        for port in 7000 7001 7002; do
          redis-server --port $$port --cluster-enabled yes --cluster-config-file /tmp/nodes-$$port.conf \
            --save '' --appendonly no --cluster-announce-hostname redis-cluster \
            --cluster-preferred-endpoint-type hostname --daemonize yes
        done
        sleep 1
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 3s
      timeout: 2s
      retries: 20

  # The whole test suite on Linux against the real Redis above (opt-in: `docker compose run --rm tests`).
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_SENTINEL_NODES: redis-sentinel:26379
      REDIS_SENTINEL_NAME: gw
      REDIS_CLUSTER_NODES: redis-cluster:7000,redis-cluster:7001,redis-cluster:7002
    depends_on:
      redis:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
